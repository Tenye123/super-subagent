<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Super Subagent icon.

    Concept: one controller node on the left dispatching to two worker nodes on
    the right. The arrows are deliberately one-way -- this product is about
    pushing work out, not about clustering for mutual replication.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7cf6"/>
      <stop offset="1" stop-color="#7b5cf0"/>
    </linearGradient>
  </defs>

  <!-- controller -->
  <rect x="4" y="22" width="18" height="20" rx="5" fill="url(#g)"/>
  <circle cx="13" cy="32" r="3.2" fill="#ffffff"/>

  <!-- dispatch arrows -->
  <path d="M24 27 L34 20" stroke="url(#g)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M24 37 L34 44" stroke="url(#g)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M30 17 L34 20 L29.5 22.5" stroke="url(#g)" stroke-width="2.6" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M30 47 L34 44 L29.5 41.5" stroke="url(#g)" stroke-width="2.6" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- worker: top -->
  <rect x="38" y="8" width="22" height="17" rx="4.5"
        fill="none" stroke="url(#g)" stroke-width="2.6"/>
  <circle cx="49" cy="16.5" r="2.6" fill="url(#g)"/>

  <!-- worker: bottom -->
  <rect x="38" y="39" width="22" height="17" rx="4.5"
        fill="none" stroke="url(#g)" stroke-width="2.6"/>
  <circle cx="49" cy="47.5" r="2.6" fill="url(#g)"/>
</svg>
